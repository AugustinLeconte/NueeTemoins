<section class="saint-banner">
  <ion-icon name="sunny-outline" class="saint-icon"></ion-icon>

  @if (saint(); as s) {
    <div class="saint-text">
      <span class="saint-label">{{ 'saint.title' | transloco }}</span>
      <strong class="saint-name" [innerHTML]="s.nom"></strong>
      <span class="saint-desc" [innerHTML]="s.description"></span>
    </div>
    <a
      class="saint-link"
      [href]="s.lien"
      target="_blank"
      rel="noopener"
      [attr.aria-label]="'saint.learnMore' | transloco"
    >
      <ion-icon name="open-outline"></ion-icon>
    </a>
  } @else if (error()) {
    <span class="saint-desc">{{ 'saint.unavailable' | transloco }}</span>
  } @else {
    <div class="saint-text">
      <ion-skeleton-text [animated]="true" style="width: 160px"></ion-skeleton-text>
      <ion-skeleton-text [animated]="true" style="width: 220px"></ion-skeleton-text>
    </div>
  }
</section>
