<h1>Inscription</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <input type="email" formControlName="email" placeholder="Email" autocomplete="email" />
      <input type="password" formControlName="password" placeholder="Mot de passe (8 caractères min.)" autocomplete="new-password" />
      @if (error) { <p class="error">{{ error }}</p> }
      <button type="submit" [disabled]="form.invalid || loading">Créer mon compte</button>
    </form>
    <button type="button" (click)="google()">S'inscrire avec Google</button>
    <p>Déjà inscrit ? <a routerLink="/login">Se connecter</a></p>
