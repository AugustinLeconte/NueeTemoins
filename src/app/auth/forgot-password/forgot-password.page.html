<h1>{{ 'auth.forgot.title' | transloco }}</h1>
@if (sent()) {
<p>{{ 'auth.forgot.sent' | transloco }}</p>
<p><a routerLink="/login">{{ 'auth.forgot.backToLogin' | transloco }}</a></p>
} @else {
<p>{{ 'auth.forgot.intro' | transloco }}</p>
<form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="loading()">
  <input type="email" formControlName="email" [placeholder]="'auth.email' | transloco" autocomplete="email" />
  <button type="submit" [disabled]="form.invalid || loading()">
    @if (loading()) {
    <span class="spinner" aria-hidden="true"></span>
    <span>{{ 'auth.loading' | transloco }}</span>
    } @else { {{ 'auth.forgot.submit' | transloco }} }
  </button>
</form>
<p><a routerLink="/login">{{ 'auth.forgot.backToLogin' | transloco }}</a></p>
}
