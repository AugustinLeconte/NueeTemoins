<h1>{{ 'auth.reset.title' | transloco }}</h1>
@if (invalidLink()) {
<p class="error" role="alert">{{ 'auth.reset.invalidLink' | transloco }}</p>
<p><a routerLink="/forgot-password">{{ 'auth.reset.requestNew' | transloco }}</a></p>
} @else {
<form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="loading()">
  <input
    type="password"
    formControlName="password"
    [placeholder]="'auth.reset.newPassword' | transloco"
    autocomplete="new-password"
  />
  @if (error()) {
  <p class="error" role="alert">{{ 'auth.reset.error' | transloco }}</p>
  }
  <button type="submit" [disabled]="form.invalid || loading()">
    @if (loading()) {
    <span class="spinner" aria-hidden="true"></span>
    <span>{{ 'auth.loading' | transloco }}</span>
    } @else { {{ 'auth.reset.submit' | transloco }} }
  </button>
</form>
}
