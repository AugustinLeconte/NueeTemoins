<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Cartes</ion-title>
    <ion-buttons slot="end"><app-user-avatar /></ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (c of cards(); track c.publicId) {
      <ion-item>
        @if (c.imageUrl) {
          <ion-thumbnail slot="start"><img [src]="c.imageUrl" [alt]="c.title" /></ion-thumbnail>
        }
        <ion-label>
          <h2>{{ c.title }}</h2>
          <p>{{ familyNames(c) }} · {{ c.rarity }} · {{ c.publicId }}</p>
        </ion-label>
        <ion-button fill="clear" [routerLink]="['/admin/cards', c.publicId]">
          <ion-icon slot="icon-only" name="create-outline"></ion-icon>
        </ion-button>
        <ion-button fill="clear" color="danger" (click)="remove(c)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-button>
      </ion-item>
    } @empty {
      <p class="ion-padding">Aucune carte pour le moment.</p>
    }
  </ion-list>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button routerLink="/admin/cards/new"><ion-icon name="add"></ion-icon></ion-fab-button>
  </ion-fab>
</ion-content>
