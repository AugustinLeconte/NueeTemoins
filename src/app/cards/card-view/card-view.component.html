<article
  class="card"
  [class.active]="active()"
  [attr.data-rarity]="rarity()"
  [attr.data-family]="primaryFamily()"
  [attr.data-families]="familySlugs()"
  (pointermove)="onMove($event)"
  (pointerdown)="onMove($event)"
  (pointerleave)="onLeave($event)"
  (pointercancel)="onLeave($event)"
>
  @if (imageUrl()) {
    <img [src]="imageUrl()" alt="" draggable="false" />
  } @else {
    <div class="placeholder">Image</div>
  }

  @if (families().length) {
    <div class="families">
      @for (f of families(); track f.publicId) {
        <span class="family">{{ f.name }}</span>
      }
    </div>
  }

  <div class="info">
    <h3>{{ title() || 'Titre de la carte' }}</h3>
    @if (subtitle()) { <small>{{ subtitle() }}</small> }
    @if (feastLabel()) { <span class="feast">{{ feastLabel() }}</span> }
    @if (description()) { <p>{{ description() }}</p> }
  </div>
</article>
