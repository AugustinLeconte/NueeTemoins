[build]
  command = "npm run build"
  publish = "www"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/auth/*"
  to = "https://ep-square-band-b9tn9qna.neonauth.c-7.eu-central-1.aws.neon.tech/neondb/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
